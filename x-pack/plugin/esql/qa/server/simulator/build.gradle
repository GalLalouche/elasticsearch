apply plugin: 'elasticsearch.internal-java-rest-test'

// junit-vintage-engine and junit-quickcheck both transitively pull in junit:junit:4.x which depends on
// hamcrest-core:1.3. The Elasticsearch test framework provides hamcrest-3.0; the duplicate causes jar-hell.
// Exclude hamcrest-core across the entire runtime classpath.
configurations.named('javaRestTestRuntimeClasspath') {
  exclude group: 'org.hamcrest', module: 'hamcrest-core'
}

dependencies {
  javaRestTestImplementation project(xpackModule('esql:qa:server'))
  javaRestTestImplementation project(xpackModule('esql'))
  javaRestTestImplementation('com.pholser:junit-quickcheck:1.0')
  // Needed so useJUnitPlatform() discovers JUnit 4 tests (ESRestTestCase and JUnitQuickcheck) alongside each other
  javaRestTestRuntimeOnly('org.junit.vintage:junit-vintage-engine:5.12.1')
  javaRestTestRuntimeOnly('org.junit.platform:junit-platform-launcher:1.12.1')

  clusterPlugins project(':plugins:mapper-size')
  clusterPlugins project(':plugins:mapper-murmur3')
  clusterPlugins project(':x-pack:plugin:inference:qa:test-service-plugin')
}

restResources {
  restApi {
    include '_common', 'bulk', 'indices', 'esql', 'cluster'
  }
}

tasks.named('javaRestTest') {
  usesDefaultDistribution("to be triaged")
  useJUnitPlatform()
  maxParallelForks = 1
  systemProperty 'simulator.planDepth', providers.systemProperty('simulator.planDepth').getOrElse('5')
  providers.systemProperty('simulator.query').orElse('').get().with { query ->
    if (!query.isEmpty()) systemProperty 'simulator.query', query
  }
  providers.systemProperty('simulator.data').orElse('').get().with { data ->
    if (!data.isEmpty()) systemProperty 'simulator.data', data
  }
  providers.systemProperty('simulator.failureMode').orElse('').get().with { mode ->
    if (!mode.isEmpty()) systemProperty 'simulator.failureMode', mode
  }
  providers.systemProperty('simulator.queryFile').orElse('').get().with { f ->
    if (!f.isEmpty()) systemProperty 'simulator.queryFile', f
  }
  providers.systemProperty('simulator.dataFile').orElse('').get().with { f ->
    if (!f.isEmpty()) systemProperty 'simulator.dataFile', f
  }
}
